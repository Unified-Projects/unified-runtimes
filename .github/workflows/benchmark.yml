name: Benchmark

on:
    pull_request:
        branches: ["main"]
        paths-ignore:
            - "**/*.md"
            - "LICENCE"
            - ".vscode/**"
            - ".editorconfig"
    workflow_dispatch:
        inputs:
            duration:
                description: "Benchmark duration in seconds"
                required: false
                default: "30"
            runtime_image:
                description: "Runtime image to test with"
                required: false
                default: "openruntimes/node:v5-22"
            function:
                description: "Function type (node, nextjs)"
                required: false
                default: "node"
            opr_image:
                description: "OpenRuntimes executor image to compare against"
                required: false
                default: "openruntimes/executor:0.29.0"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    BENCH_SECRET: benchmark-secret
    BENCH_DURATION: ${{ github.event.inputs.duration || '30' }}
    BENCH_RUNTIME_IMAGE: ${{ github.event.inputs.runtime_image || 'openruntimes/node:v5-22' }}
    BENCH_FUNCTION: ${{ github.event.inputs.function || 'node' }}
    BENCH_OPR_IMAGE: ${{ github.event.inputs.opr_image || 'openruntimes/executor:0.29.0' }}
    BENCH_FUNCTION_SOURCE: ${{ github.workspace }}/crates/urt-executor/tests/fixtures/node-function
    BENCH_OUTPUT_JSON: benchmark_results.json
    COMPOSE_PROJECT_NAME: urt-bench

jobs:
    benchmark:
        name: Performance Benchmark
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Pre-build urt-executor image (cached)
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  file: docker/Dockerfile
                  tags: ${{ env.COMPOSE_PROJECT_NAME }}-urt-executor:latest
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Pre-build bench-runner image (cached)
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  file: crates/urt-executor/Dockerfile.test
                  tags: ${{ env.COMPOSE_PROJECT_NAME }}-bench-runner:latest
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Pre-clean stale containers
              run: |
                  docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" -f crates/urt-executor/docker-compose.test.yml \
                      --profile test --profile bench down -v --remove-orphans 2>/dev/null || true
                  docker ps -a --filter "label=urt.managed" -q | xargs -r docker rm -f 2>/dev/null || true
                  docker network rm e2e-test-network 2>/dev/null || true

            - name: Pre-pull benchmark runtime image
              run: |
                  echo "Pulling runtime image: ${{ env.BENCH_RUNTIME_IMAGE }}"
                  docker pull "${{ env.BENCH_RUNTIME_IMAGE }}"
                  docker image inspect "${{ env.BENCH_RUNTIME_IMAGE }}" --format 'Pulled {{.RepoTags}} (id={{.Id}})'
                  echo "Pulling OpenRuntimes executor image: ${{ env.BENCH_OPR_IMAGE }}"
                  docker pull "${{ env.BENCH_OPR_IMAGE }}"

            - name: Run dockerized benchmarks
              run: |
                  docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" -f crates/urt-executor/docker-compose.test.yml \
                      --profile bench up --no-build --abort-on-container-exit --exit-code-from bench-runner

            - name: Capture benchmark output
              if: always()
              run: |
                  docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" -f crates/urt-executor/docker-compose.test.yml \
                      logs --no-color bench-runner > benchmark_output.txt || true

                  # Prefer docker compose cp (works even if the container has exited)
                  # Note: cargo bench runs with cwd=package root, so file is in /app/crates/urt-executor/
                  docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" -f crates/urt-executor/docker-compose.test.yml \
                      cp bench-runner:"/app/crates/urt-executor/${BENCH_OUTPUT_JSON}" "${BENCH_OUTPUT_JSON}" 2>/dev/null || true

                  # Fallback: try docker cp via container id
                  if [ ! -f "${BENCH_OUTPUT_JSON}" ]; then
                      BENCH_CONTAINER_ID=$(docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" -f crates/urt-executor/docker-compose.test.yml ps -q bench-runner)
                      if [ -n "$BENCH_CONTAINER_ID" ]; then
                          docker cp "$BENCH_CONTAINER_ID:/app/crates/urt-executor/${BENCH_OUTPUT_JSON}" "${BENCH_OUTPUT_JSON}" 2>/dev/null || true
                      fi
                  fi

                  echo "=== Files captured in workspace ==="
                  ls -la benchmark_output.txt "${BENCH_OUTPUT_JSON}" 2>/dev/null || true

            - name: Write benchmark summary
              if: always()
              run: |
                  {
                      echo "## Benchmark Summary"
                      echo ""

                      if [ -f "${BENCH_OUTPUT_JSON}" ]; then
                          echo "| Executor | Benchmark | RPS | Success % | p50 (ms) | p90 (ms) | p99 (ms) |"
                          echo "|----------|-----------|-----|-----------|----------|----------|----------|"
                          jq -r '
                            def success: if .total_requests == 0 then 0 else (.successful_requests / .total_requests * 100) end;
                            def fmt: . * 100 | floor / 100;
                            def row($exec; $name):
                              if . == null then empty
                              else "| \($exec) | \($name) | \(.rps|fmt) | \(success|fmt)% | \(.latency.p50_ms|fmt) | \(.latency.p90_ms|fmt) | \(.latency.p99_ms|fmt) |"
                              end;
                            def target($key; $label):
                              (.[$key] // {}) as $t |
                              [
                                ($t.ping | row($label; "Ping Endpoint")),
                                ($t.health | row($label; "Health Endpoint")),
                                ($t.execution | row($label; "Function Execution")),
                                ($t.list_runtimes | row($label; "List Runtimes"))
                              ] | .[];
                            target("urt"; "URT"), target("opr"; "OpenRuntimes")
                          ' "${BENCH_OUTPUT_JSON}"
                          echo ""
                          echo "| Executor | Cold start median (ms) | Memory mean (MB) | Memory peak (MB) | CPU mean (%) |"
                          echo "|----------|------------------------|------------------|------------------|--------------|"
                          jq -r '
                            def fmt: . * 100 | floor / 100;
                            def median: if length == 0 then null else (sort | .[length / 2 | floor]) end;
                            def target($key; $label):
                              (.[$key] // empty) as $t |
                              "| \($label) | \(([$t.cold_starts[]?.total_ms] | median | if . == null then "-" else fmt end)) | \($t.resources.mean_mem_mb // "-" | if type == "number" then fmt else . end) | \($t.resources.peak_mem_mb // "-" | if type == "number" then fmt else . end) | \($t.resources.mean_cpu_pct // "-" | if type == "number" then fmt else . end) |";
                            target("urt"; "URT"), target("opr"; "OpenRuntimes")
                          ' "${BENCH_OUTPUT_JSON}"
                          echo ""
                      else
                          echo "_No ${BENCH_OUTPUT_JSON} found._"
                          echo ""
                      fi

                      if [ -f benchmark_output.txt ]; then
                          awk '
                              /^## (Health|Execution) Concurrency Scaling/ {printing=1}
                              printing {print}
                          ' benchmark_output.txt
                          echo ""
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
              with:
                  name: benchmark-results
                  path: |
                      benchmark_output.txt
                      ${{ env.BENCH_OUTPUT_JSON }}
                  retention-days: 90
                  if-no-files-found: error

            - name: Show executor logs on failure
              if: failure()
              run: |
                  echo "=== URT Executor Logs ==="
                  docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" -f crates/urt-executor/docker-compose.test.yml \
                      logs --no-color urt-executor | tail -100

            - name: Clean up resources
              if: always()
              run: |
                  docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" -f crates/urt-executor/docker-compose.test.yml down -v --remove-orphans 2>/dev/null || true
                  docker ps -a --filter "label=urt.managed" -q | xargs -r docker rm -f 2>/dev/null || true
                  docker network rm e2e-test-network 2>/dev/null || true
                  docker system prune -f 2>/dev/null || true
                  docker volume prune -f 2>/dev/null || true
                  rm -f benchmark_output.txt benchmark_results.json 2>/dev/null || true
